name: point-guard
description: Team supervisor — keeps a live book of Barry's active sessions, delegates coding subtasks to disposable vendor agents, verifies evidence, integrates accepted work

# Worker runs are registered as Barry session rows so the reaper and the
# session apps see them; requiring the bag here fails at load time instead of
# confusingly at first delegation.
requires:
  sessions:
    reason: worker runs are recorded as session rows for liveness and history

# Phase A ships the claude worker only; cursor-agent/codex are Phase C and
# deliberately not declared yet so `bag show` does not warn about binaries the
# code cannot use.
dependencies:
  - name: claude
    install: npm i -g @anthropic-ai/claude-code
    reason: the headless one-shot worker and the restricted diff judge
  - name: ollama
    install: brew install --cask ollama
    reason: compacts delegation evidence (diffs/reports) locally, for free
    # Advisory only (bag show warns if absent) — never blocks the install.
    # Evidence access degrades to its existing truncated-raw behavior with
    # no error when Ollama is unreachable or the model isn't pulled. Also
    # run: ollama pull qwen3:4b

tools:
  entry: tools.ts
  env:
    - BARRY_DATABASE_URL
    - BARRY_SECRET
  # Callable but hidden from tools/list; discoverable via tool_search.
  deferred:
    - list_delegations
    - cancel_delegation

services:
  point-guard:
    description: Point-guard service — supervisor loop, worker scheduler, verifier, merge queue
    command: pnpm
    args: ["exec", "tsx", "server/src/index.ts"]
    working-directory: .
    port: 3868
    health: /health
    run-at-load: true
    keep-alive: true
    env:
      # Map form so a missing DB URL FAILS THE INSTALL rather than reaching
      # the service as "" and silently defaulting to barry_dev.
      BARRY_DATABASE_URL:
        source: .env
        required: true
      BARRY_SECRET:
        source: .env
        required: true
      # POST /message's model call (Heartbeat pattern -- book snapshot +
      # recent events, one call, no chaining). Declared here so the
      # manifest is the contract; resolved at request time through the
      # active identity's vault access, same as every other vault secret --
      # never written into the plist (a plist-frozen secret outlives
      # rotation). item defaults to the variable name, field to "password".
      OPENAI_API_KEY:
        source: vault
        item: VANTAGE_OPENAI_API_KEY

  web:
    description: Point Guard web app — glance at the book and message point-guard from a browser or phone
    command: pnpm
    args: ["exec", "tsx", "web-server/src/index.ts"]
    working-directory: .
    port: 4895
    health: /health
    host: point.barry.lan
    # Published through the shared cloudflared tunnel so the book can be
    # checked from the phone -- `host` above only resolves via /etc/hosts.
    # The origin has no auth of its own, so the Cloudflare Access application
    # "Barry Point Guard" (cloudflare_zero_trust_access_application.
    # barry_point_guard in infra/cloudflare/access.tf) is the only thing
    # between the internet and this proxy. Apply that app FIRST and confirm
    # it is live before adding the DNS record -- see the ordering note in
    # dns.tf.
    tunnel:
      hostname: point.barry.rocks
    env:
      # point-guard requires BARRY_SECRET; the browser must never hold it, so
      # the server attaches it and re-exposes only the endpoints the UI needs.
      BARRY_SECRET:
        source: .env
        required: true
    run-at-load: true
    keep-alive: true

# No `apps:` block. The macOS client is its own repo now
# (github.com/perintyler/point-guard-macos), so its build.sh is not on a path
# this manifest can name -- a bag can only declare an app it contains. It is
# installed from there, and jalen-brunson pins the pair together.

# No `traits:` block. The auto-trait `point-guard` (readwrite over the
# namespace) is exactly right; hand-declaring it would duplicate the name —
# same reasoning as bags/approvals.
